name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project invariants
        shell: pwsh
        run: ./tests/Validate.ps1

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck busybox libarchive-tools
          shellcheck -S error -s sh install.sh router/*.sh

      - name: Native installer behavior on BusyBox ash
        run: |
          chmod +x tests/ash-runner.sh
          PW_TEST_SHELL="$PWD/tests/ash-runner.sh" python3 tests/test_native.py

      - name: Test cleanup plans
        run: sh ./tests/CleanupPlan.sh

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Validate.ps1
