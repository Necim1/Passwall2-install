name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project invariants
        shell: pwsh
        run: ./tests/Validate.ps1

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S error -s sh router/*.sh

      - name: Test cleanup plans
        run: sh ./tests/CleanupPlan.sh

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Validate.ps1

      - name: Generate an unencrypted temporary Ed25519 key
        shell: powershell
        run: .\tests\SshKeygen.Windows.ps1
